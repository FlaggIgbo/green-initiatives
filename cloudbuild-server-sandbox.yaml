# Google Cloud Build configuration for SERVER - SANDBOX environment
# Triggered automatically on main branch pushes (server changes only)
# Deploys to: greeninitiatives-server-sandbox Cloud Run service
#
# Prerequisites:
#   gcloud artifacts repositories create greeninitiatives \
#     --repository-format=docker \
#     --location=us-central1 \
#     --description="GreenInitiatives Docker images"

steps:
  # Build the server Docker image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'GreenInitiatives'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.server'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:$_SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:latest'
      - '.'
    timeout: 1200s

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:$_SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:latest'

  # Deploy to Cloud Run (SANDBOX)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'greeninitiatives-server-sandbox'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:$_SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '60s'
      - '--startup-probe=httpGet.path=/health'
      - '--liveness-probe=httpGet.path=/health'
      - '--set-env-vars'
      - 'NODE_ENV=sandbox,SERVE_STATIC=false,APP_VERSION=$_SHORT_SHA,ALLOW_MOCK_DATA_ON_CLOUD=true,STRIPE_DISABLED=true,EMAIL_OTP_ENABLED=true'
      - '--set-secrets'
      - 'MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret-sandbox:latest,STRIPE_SECRET_KEY=stripe-secret-key-sandbox:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret-sandbox:latest,ROUNDUP_CRON_SECRET=roundup-cron-secret-sandbox:latest,RESEND_API_KEY=resend-api-key:latest'
      - '--labels'
      - 'environment=sandbox,component=server'

  # Post deployment summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVICE_URL=$$(gcloud run services describe greeninitiatives-server-sandbox \
          --region us-central1 \
          --format 'value(status.url)')
        echo "🚀 Server Sandbox deployed successfully!"
        echo "📍 API URL: $$SERVICE_URL"
        echo "🔖 Commit: $_SHORT_SHA"

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:$_SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/server-sandbox:latest'

timeout: 1800s

substitutions:
  _SHORT_SHA: 'unknown'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY


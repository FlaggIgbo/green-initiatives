# Google Cloud Build configuration for CLIENT - SANDBOX environment
# Triggered automatically on main branch pushes (client changes only)
# Deploys to: greeninitiatives-client-sandbox Cloud Run service
#
# Prerequisites:
#   1. Artifact Registry repository:
#      gcloud artifacts repositories create greeninitiatives \
#        --repository-format=docker \
#        --location=us-central1 \
#        --description="GreenInitiatives Docker images"
#
#   2. Server service must be deployed first to get API URL

steps:
  # Get the server API URL (must be deployed first)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-api-url'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        echo "🔍 Looking for server sandbox service..."
        
        # Try to get the server URL
        API_URL=$$(gcloud run services describe greeninitiatives-server-sandbox \
          --region us-central1 \
          --format 'value(status.url)' 2>&1) || true
        
        echo "Raw gcloud output: $$API_URL"
        
        # Check if we got a valid URL (starts with https://)
        if [[ "$$API_URL" == https://* ]]; then
          echo "✅ Found server at: $$API_URL"
          echo "$$API_URL" > /workspace/api_url.txt
        else
          echo "⚠️  Could not find server service. Output was: $$API_URL"
          echo "📋 Available Cloud Run services:"
          gcloud run services list --region us-central1 --format="table(SERVICE,REGION,URL)" || true
          
          # Use hardcoded fallback - CRITICAL for client to work
          FALLBACK_URL="https://greeninitiatives-server-sandbox-fdoxa6bvkq-uc.a.run.app"
          echo "🔄 Using fallback URL: $$FALLBACK_URL"
          echo "$$FALLBACK_URL" > /workspace/api_url.txt
        fi
        
        echo "📄 Contents of api_url.txt:"
        cat /workspace/api_url.txt

  # Build the client Docker image with API URL
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    dir: 'GreenInitiatives'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        
        # Read the API URL from the workspace file
        if [ -f /workspace/api_url.txt ]; then
          API_URL=$$(cat /workspace/api_url.txt)
        else
          echo "❌ ERROR: /workspace/api_url.txt not found!"
          exit 1
        fi
        
        # Validate we have a URL
        if [ -z "$$API_URL" ]; then
          echo "❌ ERROR: API_URL is empty!"
          exit 1
        fi
        
        echo "🏗️  Building client with VITE_API_URL=$$API_URL"
        docker build \
          -f Dockerfile.client \
          --build-arg VITE_API_URL="$$API_URL" \
          --build-arg VITE_CDN_URL="https://storage.googleapis.com/berrybank-greeninitiatives-assets" \
          --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${_VITE_STRIPE_PUBLISHABLE_KEY}" \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:$_SHORT_SHA \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:latest \
          .
    timeout: 1200s

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:$_SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:latest'

  # Deploy to Cloud Run (SANDBOX)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'greeninitiatives-client-sandbox'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:$_SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=sandbox'
      - '--labels'
      - 'environment=sandbox,component=client'

  # Post deployment summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'summary'
    entrypoint: bash
    args:
      - '-c'
      - |
        CLIENT_URL=$$(gcloud run services describe greeninitiatives-client-sandbox \
          --region us-central1 \
          --format 'value(status.url)')
        API_URL=$$(cat /workspace/api_url.txt)
        echo "🚀 Client Sandbox deployed successfully!"
        echo "📍 Client URL: $$CLIENT_URL"
        echo "🔗 API URL: $${API_URL:-'(using relative paths)'}"
        echo "🔖 Commit: $_SHORT_SHA"

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:$_SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/greeninitiatives/client-sandbox:latest'

timeout: 1800s

substitutions:
  _SHORT_SHA: 'unknown'
  _VITE_STRIPE_PUBLISHABLE_KEY: 'pk_test_51SP6ceK2hQBWdyTT5P3j98kqA0k9Q25bpPeSNWmjQgzbAmt9TC8hJ0MNL9R6X5zootBtfXEvo8XZbzF1JaGtcraN00qm0RfwkI'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
